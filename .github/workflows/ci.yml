name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # linux-x64, win-x64, osx-arm64 and linux-arm64: four of the five platforms NetCrypto ships the
        # native BBS library for (osx-x64 is the fifth). On GitHub Actions a test that needs that library
        # fails, and is never skipped, when it does not load (TestSupport's BbsNativeLibrary), so a green
        # leg means the bbs-2023 tests ran there (issue #57). docs/conformance.md lists what is and is not
        # exercised: keep it in step with this list. All four are standard GitHub-hosted runners.
        os: [ubuntu-latest, windows-latest, macos-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Credentials.sln
      # Release build with TreatWarningsAsErrors is itself the XML-doc (CS1591) and public-API
      # (RS0016/RS0017) gate — a missing doc or an undeclared public member fails here.
      - name: Build (warnings-as-errors)
        run: dotnet build Credentials.sln -c Release --no-restore
      # Exclude the W3C conformance suite (it needs the Node test suite + the ASP.NET shim; runs in
      # conformance.yml). The filter is a no-op until those tests are tagged Category=Conformance in M8c.
      # The result files (TRX) are what the next step compares its second run with.
      - name: Test
        run: dotnet test Credentials.sln -c Release --no-build --filter "Category!=Conformance" --logger trx --results-directory artifacts/test-results
      # The no-library gate (issue #57): the same test assemblies run again from copies with NetCrypto's
      # native BBS library removed. Every test of a bbs-2023 test class has to fail there; passed, skipped
      # and "no result" are each reported, and so is any other test whose outcome changes. The script uses
      # the filter of the step above.
      - name: bbs-2023 tests fail without the native library
        shell: bash
        run: tools/check-bbs-tests-without-library.sh --results artifacts/test-results
      # The gate on a project of deliberately wrong tests (tests/Credentials.GateFixtures, not in the
      # solution): it has to report exactly the findings that project is known to have, on every platform.
      - name: The no-library gate reports what it has to
        shell: bash
        run: tools/check-bbs-tests-without-library.sh --self-test

  no-newtonsoft:
    name: no-Newtonsoft consumer closure
    runs-on: ubuntu-latest
    # Gate on the build so a compile break surfaces as one root-cause job, not three red peers.
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # Packs Core + DI, restores the ConsumerProbe against them, asserts Newtonsoft is absent from
      # the transitive closure (NFR-002). The opt-in Credentials.Rdfc is the sanctioned carrier.
      - name: Assert default closure is Newtonsoft-free
        run: ./tools/check-no-newtonsoft-closure.sh

  semver:
    name: API compatibility (semver)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore tools
        run: dotnet tool restore
      # Compares each packed library against its last published nuget.org version (NFR-005). Skips a
      # package when it has no published baseline yet (pre-release) — logged, never falsely green.
      - name: ApiCompat against published baseline
        run: ./tools/check-api-compat.sh

  api-coverage:
    name: API coverage (samples exercise the surface)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # Runs every sample under coverlet (scoped to Core + DI) and asserts every gateable public type
      # is exercised by at least one sample, with documented exemptions in
      # tools/api-coverage/api-coverage-exclusions.txt.
      - name: Assert samples cover the public surface
        run: ./tools/run-api-coverage.sh
